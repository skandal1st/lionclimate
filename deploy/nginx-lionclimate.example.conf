# Фрагмент для сайта lionclimate.ru — вставить в server { } вашего vhost
# или объединить с существующим конфигом.
#
# ВАЖНО: блок location /api/ должен быть в том же server { }, что и ssl_certificate для lionclimate.ru.
# Путь root — к каталогу со сборкой frontend (dist), не к корню репозитория без dist.
#
# После правок: sudo nginx -t && sudo systemctl reload nginx

# Проверка API без HTTPS (на самом сервере):
#   curl -s http://127.0.0.1:3001/api/health
# Проверка через nginx:
#   curl -s https://lionclimate.ru/api/health

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /img/ {
    alias /var/www/lionclimate.ru/img/;
}

location / {
    root /var/www/lionclimate.ru/dist;
    try_files $uri $uri/ /index.html;
}
