# Замените этим целиком блок "Основной сервер для HTTPS без www"
# (server { listen 443 ... server_name lionclimate.ru; ... })
# или вставьте внутрь него блоки location /api/, location /img/, и замените root + location /.
#
# Сборка фронта: cd /var/www/lionclimate.ru/frontend && npm run build && dist в /var/www/lionclimate.ru/dist
# API: systemctl restart lionclimate-api (порт 3001)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lionclimate.ru;

    # Статика React SPA (vite build → dist/)
    root /var/www/lionclimate.ru/dist;
    index index.html;

    access_log /var/log/nginx/lionclimate.ru.access.log;
    error_log /var/log/nginx/lionclimate.ru.error.log;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;

    # --- Node API (обязательно ДО location /) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Картинки из корня репозитория (рядом с dist), пути /img/...
    location /img/ {
        alias /var/www/lionclimate.ru/img/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Файлы из корня проекта (не в dist)
    location = /robots.txt {
        alias /var/www/lionclimate.ru/robots.txt;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        alias /var/www/lionclimate.ru/sitemap.xml;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Старый PHP (если ещё нужен send-telegram.php / admin) — иначе блок можно удалить
    location ~ \.php$ {
        root /var/www/lionclimate.ru;
        # PHP только для старых путей; /api/* обслуживает Node
        if ($request_uri !~ ^/(send-telegram\.php|admin/)) {
            return 404;
        }
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        client_max_body_size 10M;
    }

    # SPA: все маршруты React → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    client_max_body_size 10M;
    keepalive_timeout 65;
    send_timeout 60;

    ssl_certificate /etc/letsencrypt/live/lionclimate.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lionclimate.ru/privkey.pem;
}
