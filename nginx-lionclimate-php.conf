# Фрагмент для /etc/nginx/sites-available/lionclimate.ru
# Замените блок "PHP обработка для send-telegram.php" на этот блок.

    # PHP: send-telegram.php, админка (/admin/), API каталога (/api/)
    location ~ \.php$ {
        # Разрешить только нужные PHP-скрипты (безопасность)
        if ($request_uri !~ ^/(send-telegram\.php|admin/|api/)) {
            return 404;
        }

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        client_max_body_size 10M;
    }
